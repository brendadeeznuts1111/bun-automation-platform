# bunfig.toml — project-level Bun configuration
# https://bun.com/docs/runtime/bunfig

[install]
# Global virtual store: symlink packages from a shared cache instead of
# copying files into each project's node_modules. Cuts install time by ~85%
# (symlinks vs file copies) and reduces disk usage across projects.
# Override with BUN_INSTALL_GLOBAL_STORE=0 if needed.
globalStore = true

[test]
# Preload before any test file imports — sets DB_PATH to a temp file so
# tests never touch ./data/platform.db. See tests/setup.ts.
# Static test env (NODE_ENV=test) lives in .env.test, auto-loaded by bun test.
preload = ["./tests/setup.ts"]

# Don't discover tests under these paths. Pruned during scanning, so cheap.
# node_modules: dependencies that may ship their own .test.ts files.
# data/:        runtime SQLite + screenshots — never a test location.
pathIgnorePatterns = ["node_modules/**", "data/**"]

# Run tests in random order to surface order-dependent / shared-state bugs
# (the closeDB-across-files failure we hit is exactly this class). Fixed seed
# for reproducibility — bump to re-randomize. CLI --randomize overrides.
randomize = true
seed = 20260815

# Auto-retry failed tests up to 2 times. Surfaces transient/flaky failures
# (e.g. timing-sensitive setSystemTime, spawn-pipe reads) without masking
# real bugs — a test must pass on a retry to count as passing. Per-test
# { retry: N } overrides this. CLI --retry overrides.
retry = 2

# Coverage — text reporter to stdout for local runs, lcov for CI ingestion.
# Threshold is a floor below current coverage (91% lines / 94% functions as of
# 2026-08-15), with headroom for the gaps flagged in OPEN_TASKS.md. Raise as
# coverage improves.
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.85, functions = 0.85 }

[test.reporter]
# JUnit XML for CI ingestion (GitHub Actions, GitLab, Jenkins). Console
# output is unchanged — this writes an additional XML file at end of run.
junit = "./coverage/junit.xml"
